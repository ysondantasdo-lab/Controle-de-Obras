name: Gerar App Bundle
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Gradle do Sistema
        uses: gradle/actions/setup-gradle@v3

      - name: Criar Arquivos de Estrutura do Android
        run: |
          # Cria a pasta app caso ela não exista no sistema de arquivos do GitHub
          mkdir -p app

          # Cria as configurações básicas necessárias na raiz do seu projeto
          echo "include ':app'" > settings.gradle

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          apply plugin: 'org.jetbrains.kotlin.android'

          android {
              namespace 'com.example.controledeobras'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.controledeobras"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              buildFeatures { compose true }
              composeOptions { kotlinCompilerExtensionVersion '1.5.8' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
              implementation 'androidx.activity:activity-compose:1.8.2'
              implementation platform('androidx.compose:compose-bom:2024.02.00')
              implementation 'androidx.compose.ui:ui'
              implementation 'androidx.compose.ui:ui-graphics'
              implementation 'androidx.compose.material3:material3'
              implementation 'androidx.navigation:navigation-compose:2.7.7'
              implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
          }
          EOF

      - name: Compilar o App Bundle
        run: gradle :app:bundleRelease

      - name: Disponibilizar Download do Arquivo (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: aplicativo-aab
          path: "**/build/outputs/bundle/release/*.aab"
