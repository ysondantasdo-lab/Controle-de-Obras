name: Gerar App Bundle
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Criar Projeto Android Estruturado
        run: |
          # 1. Cria um projeto Android padrão usando a ferramenta oficial (Command Line Tools)
          wget https://google.com
          unzip commandlinetools-linux-11076708_latest.zip
          mkdir -p android-sdk/cmdline-tools
          mv cmdline-tools android-sdk/cmdline-tools/latest
          export ANDROID_HOME=$PWD/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          
          # Aceita licenças e instala ferramentas essenciais
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          
          # 2. Inicializa a estrutura do Gradle do zero
          gradle wrapper --gradle-version 8.4

      - name: Injetar Codigo Puro do AI Studio no Projeto
        run: |
          # Garante que as pastas do aplicativo existam e move seus arquivos para o local correto de compilação
          mkdir -p app/src/main/java
          mkdir -p app/src/main/res
          
          # Move o Manifesto e os códigos gerados pelo Gemini
          [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/
          [ -d src ] && cp -r src/* app/src/main/java/ || true
          [ -d res ] && cp -r res/* app/src/main/res/ || true
          
          # Cria os arquivos de configuração mínimos que o Android exige para compilar
          echo "include ':app'" > settings.gradle
          
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.controledeobras'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.controledeobras"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              buildFeatures { compose true }
              composeOptions { kotlinCompilerExtensionVersion '1.5.8' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
              implementation 'androidx.activity:activity-compose:1.8.2'
              implementation platform('androidx.compose:compose-bom:2024.02.00')
              implementation 'androidx.compose.ui:ui'
              implementation 'androidx.compose.ui:ui-graphics'
              implementation 'androidx.compose.material3:material3'
              implementation 'androidx.navigation:navigation-compose:2.7.7'
              implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
          }
          EOF

      - name: Executar Compilação do App Bundle
        run: |
          chmod +x gradlew
          ./gradlew :app:bundleRelease

      - name: Baixar Arquivo Final
        uses: actions/upload-artifact@v4
        with:
          name: aplicativo-aab
          path: app/build/outputs/bundle/release/*.aab
