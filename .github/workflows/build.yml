name: Gerar App Bundle
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Esta ação oficial configura o Gradle automaticamente, eliminando a necessidade do arquivo 'gradlew'
      - name: Configurar Gradle do Sistema
        uses: gradle/actions/setup-gradle@v3

      - name: Criar Arquivos de Estrutura do Android
        run: |
          # Cria as configurações básicas necessárias na raiz do seu projeto
          echo "include ':app'" > settings.gradle

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.controledeobras'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.controledeobras"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              buildFeatures { compose true }
              composeOptions { kotlinCompilerExtensionVersion '1.5.8' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
              implementation 'androidx.activity:activity-compose:1.8.2'
              implementation platform('androidx.compose:compose-bom:2024.02.00')
              implementation 'androidx.compose.ui:ui'
              implementation 'androidx.compose.ui:ui-graphics'
              implementation 'androidx.compose.material3:material3'
              implementation 'androidx.navigation:navigation-compose:2.7.7'
              implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
          }
          EOF

      # Compila diretamente usando o comando global do sistema
      - name: Compilar o App Bundle
        run: gradle :app:bundleRelease

      - name: Disponibilizar Download do Arquivo (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: aplicativo-aab
          path: "**/build/outputs/bundle/release/*.aab"
