workflows:
  android-build:
    name: Android Release Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      groups:
        - android-signing
      vars:
        PACKAGE_NAME: "com.example.controledeobras"
      node: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
    scripts:
      - name: Configurar e Rodar o Gradle Wrapper
        script: |
          # Cria a pasta interna que o Gradle exige caso ela nao exista
          mkdir -p gradle/wrapper
          
          # Baixa o arquivo jar diretamente para o lugar correto na nuvem
          curl -L -o gradle/wrapper/gradle-wrapper.jar https://githubusercontent.com
          
          # Da permissao de execucao para o script gradlew que voce acabou de criar
          chmod +x gradlew
          
          # Compila o aplicativo usando a estrutura perfeita e na versao 9.3.1
          ./gradlew bundleRelease
    artifacts:
      - app/build/outputs/bundle/release/*.aab
