workflows:
  android-build:
    name: Android Release Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      groups:
        - android-signing
      vars:
        PACKAGE_NAME: "com.example.controledeobras"
      node: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
    scripts:
      - name: Configurar Chave de Assinatura
        script: |
          # Transforma o texto Base64 de volta no arquivo de chave real na pasta do build
          echo $CM_KEYSTORE | base64 --decode > $CM_BUILD_DIR/controledeobra.p12
      - name: Build Android App Bundle
        script: |
          # Gera toda a estrutura interna do wrapper na versao correta de forma nativa e isolada
          gradle wrapper --gradle-version 9.3.1
          
          # Da permissao de execucao ao arquivo criado
          chmod +x gradlew
          
          # Compila o app injetando as credenciais de assinatura que salvamos
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$CM_BUILD_DIR/controledeobra.p12 \
            -Pandroid.injected.signing.store.password=$CM_KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$CM_KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$CM_KEY_PASSWORD
    artifacts:
      - app/build/outputs/bundle/release/*.aab
